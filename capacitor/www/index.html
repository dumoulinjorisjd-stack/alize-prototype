<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ti-Services</title>
<!-- Page LOCALE de la coquille : affichée quand ti-services.fr ne répond pas (pas de
     réseau au lancement, mode avion). capacitor.config.json → server.errorPath.
     Sans elle, l'app s'ouvrirait sur un écran vide : c'est un motif de refus à l'examen. -->
<style>
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#FBF7F4;color:#231E33;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));box-sizing:border-box}
  .nom{font-weight:800;font-size:30px;letter-spacing:-.02em;margin:18px 0 8px}.nom b{color:#CE301C}
  p{font-size:16px;line-height:1.45;color:#4E4757;margin:0 0 24px}
  button{font:700 16px -apple-system,sans-serif;color:#fff;border:0;border-radius:12px;height:52px;padding:0 28px;
    background:linear-gradient(180deg,#FF6A5B,#CE301C)}
  button:active{transform:scale(.98)}
</style></head>
<body><main>
  <svg width="96" height="104" viewBox="18.4 19.9 83.1 90.2" aria-hidden="true"><g transform="translate(60 63) scale(0.8) translate(-60 -55)">
    <path d="M60 7 l3.4 7 7.7 1.1 -5.6 5.4 1.3 7.6 -6.8 -3.6 -6.8 3.6 1.3 -7.6 -5.6 -5.4 7.7 -1.1z" fill="#FFC24B" stroke="#2A2340" stroke-width="1.6" stroke-linejoin="round"/>
    <g stroke="#FF6A5B" stroke-width="12" stroke-linecap="round" fill="none"><path d="M40 72 C 30 90, 26 97, 19 97"/><path d="M50 79 C 46 96, 44 101, 39 103"/><path d="M60 81 L60 103"/><path d="M70 79 C 74 96, 76 101, 81 103"/><path d="M80 72 C 90 90, 94 97, 101 97"/></g>
    <path d="M60 28 C 39 28, 29 45, 29 61 C 29 76, 43 83, 60 83 C 77 83, 91 76, 91 61 C 91 45, 81 28, 60 28 Z" fill="#FF6A5B" stroke="#2A2340" stroke-width="3"/>
    <circle cx="50" cy="57" r="7.5" fill="#fff" stroke="#2A2340" stroke-width="2"/><circle cx="70" cy="57" r="7.5" fill="#fff" stroke="#2A2340" stroke-width="2"/>
    <circle cx="51.4" cy="58.2" r="3.5" fill="#2A2340"/><circle cx="71.4" cy="58.2" r="3.5" fill="#2A2340"/>
    <path d="M54 68 Q60 74 66 68" stroke="#2A2340" stroke-width="2.6" fill="none" stroke-linecap="round"/></g></svg>
  <div class="nom"><b>Ti</b>-Services</div>
  <p id="t">Pas de connexion Internet.<br>Vérifiez le réseau, puis réessayez.</p>
  <button id="b" type="button">Réessayer</button>
</main>
<script>
  var L=(navigator.language||'fr').slice(0,2);
  var T={en:['No internet connection.<br>Check your network, then try again.','Try again'],
         pt:['Sem ligação à Internet.<br>Verifique a rede e tente novamente.','Tentar novamente']}[L];
  if(T){document.documentElement.lang=L;document.getElementById('t').innerHTML=T[0];document.getElementById('b').textContent=T[1];}
  function recharger(){location.href='https://ti-services.fr/';}
  document.getElementById('b').addEventListener('click',recharger);
  // Dès que le réseau revient, on repart sur le site, sans attendre le geste.
  window.addEventListener('online',recharger);
</script>
</body></html>
