# Construit le paquet Android (.aab) à déposer dans la console Play.
#
# Le magasin de clés et google-services.json n'existent PAS dans le dépôt : ils sont
# écrits ici, depuis les secrets, puis effacés à la fin du job — y compris si le
# build échoue.
name: Build Android (AAB Play Store)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nom de version affiché dans le Play Store (ex. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances Capacitor
        working-directory: capacitor-android
        run: npm ci

      - name: Synchroniser le projet natif
        working-directory: capacitor-android
        run: npx cap sync android

      - name: Écrire google-services.json
        working-directory: capacitor-android/android/app
        env:
          GS: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::Secret ANDROID_GOOGLE_SERVICES_JSON_B64 absent — sans lui, aucune notification."
            exit 1
          fi
          printf '%s' "$GS" | base64 -d > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" \
            || { echo "::error::google-services.json illisible — le secret a probablement été coupé."; exit 1; }

      - name: Écrire le magasin de clés
        working-directory: capacitor-android/android/app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 absent — impossible de signer."
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > ti-services-upload.jks

      - name: Construire l'AAB
        working-directory: capacitor-android/android
        env:
          TS_VERSION_CODE: ${{ github.run_number }}
          TS_VERSION_NAME: ${{ github.event.inputs.version_name }}
          TS_KEYSTORE_FILE: ti-services-upload.jks
          TS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Vérifier que le paquet est bien signé
        working-directory: capacitor-android/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::Aucun AAB produit."; exit 1; }
          jarsigner -verify "$AAB" > /dev/null \
            || { echo "::error::Le paquet n'est pas signé — Google le refuserait."; exit 1; }
          ls -la "$AAB"

      - name: Effacer les secrets du disque
        if: always()
        working-directory: capacitor-android/android/app
        run: rm -f ti-services-upload.jks google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: ti-services-${{ github.event.inputs.version_name }}-build${{ github.run_number }}
          path: capacitor-android/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
